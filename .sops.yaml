# The tenant SOPS file holds this repository's app secrets and nothing else.
#
# Every recipient here is a platform recipient, in the platform's order: the
# operator's own key, the shared machine identity the deploy decrypts with, and
# the three YubiKeys. The tenant identity the design originally named is
# deliberately not used — the apply step runs as root on smortress and already
# holds the machine identity, so a separate key would add a second secret to
# protect without narrowing that path. The delta is recorded on SDLC #726.
#
# `CODEOWNERS` names this file, because it decides who can decrypt everything
# in `secrets.sops.json`; an agent that could append a recipient here could
# widen that boundary without touching a definition.
creation_rules:
  - path_regex: secrets\.sops\.json$
    key_groups:
      - age:
          - age1skuwunreduvw8gtkzyf9atsyjnku388ly8c252h3qger84fg5d7q4kf6xs
          - age1dy66kuzcvu7tgl64pxrjymdt3ndk7g2ftsqc0nx4s8fhyv8zfyyq2h0756
          - age18suc3usnfah6g3fldvhhvmchyupg3tp2p5vgzfuprvcn6untva9qem4lf0
          - age1zepedng5vqafu95hysrxl0kadreshg2yc07epfqky5fuq2nmy5fqg649lf
          - age1xqpw0qy2mk98ptvvh5y0sxtlrxs036nng2868zd6dc4wdcrrm5mqd6pnpf
