name: apps-schema

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps-schema:
    name: apps-schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the definitions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The validator is platform-owned and never vendored here: a copy an
      # agent could edit would make this check agree with whatever it checked.
      # The pin is the reviewed SHA; smortress re-runs the same check from its
      # own image before rendering, so this is fast feedback, not the boundary.
      - name: Checkout the validator from homelab-platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: smores56/homelab-platform
          ref: fc6fb7082c001362ed84a71ed7ce002bf38df588
          path: .platform
          token: ${{ secrets.PLATFORM_TOKEN }}
          persist-credentials: false

      # The tenant SOPS file is passed still encrypted: the validator reads key
      # names only, so no identity is needed here and no value is ever exposed.
      - name: apps schema checks
        run: python3 .platform/scripts/apps-schema.py validate --root . --secrets secrets.json
