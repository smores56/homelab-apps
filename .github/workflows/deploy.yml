name: deploy

# A merge to main is the tenant's trigger: the host is told which commit moved
# and derives everything else itself (the tip, the descendancy, the rendered
# plan). This job carries no authority -- it cannot write to the host, only ask
# it to look.
#
# The job runs in a main-only Environment, so a pull request or a branch run
# cannot read its credentials even if it edits this file. In particular the
# `apps-schema` check on a PR is fast feedback; the host re-runs the same
# validator from its own image and never trusts this workflow's verdict.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-notify
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    name: notify the deploy receiver
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: deploy-notify
    permissions: {}
    steps:
      # OAuth, not an authkey: the action mints a preauthorized key from the
      # client, so the node is ephemeral and disappears with the job. The client
      # is scoped to `auth_keys` and carries only `tag:deploy`, which the tailnet
      # policy accepts on nothing but the receiver's port.
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:deploy
      - name: sign the body and notify the receiver
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/deploy-body.json"
          # One program builds the body and signs the file it just wrote: the key
          # is read from the environment, so it is in no argv and no log line, and
          # signing the file rather than a string is what makes "the bytes that
          # were signed" a thing curl can be handed.
          sig=$(python3 - "$body" <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import secrets
          import sys
          import time

          now = int(time.time())
          payload = {
              "repo": os.environ["REPO_NAME"],
              "commit": os.environ["COMMIT_SHA"],
              "ts": now,
              "nonce": secrets.token_hex(16),
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(json.dumps(payload, separators=(",", ":")) + "\n")
          with open(sys.argv[1], "rb") as handle:
              data = handle.read()
          key = os.environ["DEPLOY_WEBHOOK_SECRET"].encode()
          print(hmac.new(key, data, hashlib.sha256).hexdigest())
          PY
          )
          if [[ -z ${sig:-} ]]; then
            echo "::error::could not build the signed deploy body"
            exit 1
          fi
          # No timestamp header: the skew is read from the body's `ts`, which is
          # the value the HMAC covers. A header would be an unsigned second
          # answer to the same question, and the receiver has to pick one.
          #
          # --data-binary and not -d: `-d` strips newlines, so the bytes on the
          # wire would differ from the bytes that were signed and the receiver
          # would reject a body this job insists it sent.
          curl --fail-with-body --max-time 30 \
            -H "X-Deploy-Signature: sha256=$sig" \
            --data-binary @"$body" \
            http://smortress:8484/v1/deploy
